<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Angelos City - мультиплеер</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: #0a0a1a;
            font-family: monospace;
        }
        canvas {
            display: block;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00f3ff;
            font-size: 24px;
            z-index: 100;
            text-shadow: 0 0 30px #00f3ff;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            0% {
                opacity: 0.3;
            }
            100% {
                opacity: 1;
            }
        }
        #players-count {
            position: fixed;
            top: 15px;
            right: 15px;
            color: #00ff88;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 100;
            border: 1px solid #00ff88;
            pointer-events: none;
        }
        #jump-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(255, 0, 127, 0.25);
            border: 2px solid rgba(255, 0, 127, 0.5);
            color: #ff007f;
            font-size: 24px;
            font-weight: bold;
            z-index: 50;
            display: none;
            justify-content: center;
            align-items: center;
            touch-action: none;
            user-select: none;
        }
        #jump-btn:active {
            background: rgba(255, 0, 127, 0.4);
            transform: scale(0.92);
        }
        #chat {
            position: fixed;
            bottom: 80px;
            left: 10px;
            width: calc(100% - 20px);
            max-width: 320px;
            max-height: 180px;
            z-index: 100;
            display: none;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #00f3ff;
            border-radius: 12px;
            padding: 8px;
        }
        #chat-log {
            flex: 1;
            overflow-y: auto;
            max-height: 120px;
            color: #aabbdd;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 6px;
        }
        #chat-log .msg .name {
            color: #00f3ff;
            font-weight: bold;
        }
        #chat-log .msg .text {
            color: #ffffff;
        }
        #chat-input-row {
            display: flex;
            gap: 6px;
        }
        #chat-input {
            flex: 1;
            background: transparent;
            border: 1px solid #334466;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            font-family: monospace;
            min-height: 36px;
        }
        #chat-input:focus {
            border-color: #00f3ff;
        }
        #chat-send {
            background: transparent;
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            font-size: 14px;
        }
        #chat-send:hover {
            background: #00f3ff;
            color: #000;
        }
        #chat-toggle {
            position: fixed;
            bottom: 10px;
            left: 10px;
            z-index: 99;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            display: none;
        }
        #chat-toggle:hover {
            background: #00f3ff;
            color: #000;
        }
        @media (pointer: coarse) {
            #jump-btn {
                display: flex;
            }
        }
        @media (pointer: fine) {
            #jump-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="loading">⏳ Подключение к серверу...</div>
    <div id="players-count">👥 <span id="count-display">1</span></div>
    <div id="jump-btn">⬆</div>

    <div id="chat">
        <div id="chat-log"></div>
        <div id="chat-input-row">
            <input id="chat-input" type="text" placeholder="Написать..." maxlength="100" />
            <button id="chat-send">➤</button>
        </div>
    </div>
    <button id="chat-toggle">💬 Чат</button>

    <!-- ==================== ВСЯ ИГРА В ОДНОМ ФАЙЛЕ ==================== -->
    <script>
        // ============================================================
        // 1. ТРЁХМЕРНАЯ СЦЕНА (Three.js)
        // ============================================================
        (async function() {

            // --- Подключаем Three.js через CDN ---
            const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js');
            const { OrbitControls } = await import('https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/controls/OrbitControls.js');

            // --- Сцена ---
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.008);

            // --- Камера ---
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(0, 3, 8);
            camera.rotation.order = 'YXZ';

            // --- Рендер ---
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.prepend(renderer.domElement);

            // --- Свет ---
            const ambient = new THREE.AmbientLight(0x222244, 0.6);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0x88ccff, 1.5);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            const backLight = new THREE.DirectionalLight(0xff4488, 0.4);
            backLight.position.set(-5, 5, -10);
            scene.add(backLight);

            const bottomLight = new THREE.PointLight(0x00f3ff, 0.8, 20);
            bottomLight.position.set(0, -2, 0);
            scene.add(bottomLight);

            // --- Море ---
            const seaGeo = new THREE.PlaneGeometry(400, 400);
            const seaMat = new THREE.MeshPhongMaterial({
                color: 0x0a3a5a,
                transparent: true,
                opacity: 0.9,
                side: THREE.DoubleSide
            });
            const sea = new THREE.Mesh(seaGeo, seaMat);
            sea.rotation.x = -Math.PI / 2;
            sea.position.y = -0.5;
            sea.receiveShadow = true;
            scene.add(sea);

            // --- Корабль (процедурный) ---
            const shipContainer = new THREE.Group();

            // Палуба
            const deck = new THREE.Mesh(
                new THREE.BoxGeometry(30, 0.5, 20),
                new THREE.MeshPhongMaterial({ color: 0x444466, metalness: 0.5, roughness: 0.4 })
            );
            deck.position.y = 0.25;
            deck.receiveShadow = true;
            deck.castShadow = true;
            shipContainer.add(deck);

            // Каюта
            const cabin = new THREE.Mesh(
                new THREE.BoxGeometry(8, 4, 6),
                new THREE.MeshPhongMaterial({ color: 0x886644, roughness: 0.7 })
            );
            cabin.position.set(0, 2.5, -2);
            cabin.castShadow = true;
            cabin.receiveShadow = true;
            shipContainer.add(cabin);

            // Крыша
            const roof = new THREE.Mesh(
                new THREE.ConeGeometry(5, 1.5, 4),
                new THREE.MeshPhongMaterial({ color: 0xcc5533, roughness: 0.6 })
            );
            roof.position.set(0, 4.5, -2);
            roof.rotation.y = Math.PI / 4;
            roof.castShadow = true;
            shipContainer.add(roof);

            // Мачта
            const mast = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.5, 10),
                new THREE.MeshPhongMaterial({ color: 0x886644 })
            );
            mast.position.set(0, 5.5, 3);
            mast.castShadow = true;
            shipContainer.add(mast);

            scene.add(shipContainer);
            const mainShip = shipContainer;

            // --- Игрок (локальный) ---
            const playerPos = { x: 0, y: 1.5, z: 0 };
            const playerGroup = new THREE.Group();
            scene.add(playerGroup);

            const bodyMat = new THREE.MeshPhongMaterial({ color: 0x00ff88, flatShading: true });
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.6), bodyMat);
            body.position.y = 0.7;
            body.castShadow = true;
            playerGroup.add(body);

            const headMat = new THREE.MeshPhongMaterial({ color: 0xffccaa, flatShading: true });
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), headMat);
            head.position.y = 1.5;
            head.castShadow = true;
            playerGroup.add(head);

            // --- Управление ---
            const keys = {};
            let mouseX = 0,
                mouseY = 0;
            let mouseLocked = false;
            let eulerX = 0.2,
                eulerY = 0;
            let velocityY = 0;
            let isGrounded = true;
            let playerRotation = 0;

            // --- Физика ---
            const downRaycaster = new THREE.Raycaster();
            const forwardRaycaster = new THREE.Raycaster();
            const downVector = new THREE.Vector3(0, -1, 0);
            const moveVector = new THREE.Vector3();
            const rayOrigin = new THREE.Vector3();

            // --- Ввод ---
            document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true;
                keys[e.code] = true; });
            document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false;
                keys[e.code] = false; });

            document.addEventListener('click', () => {
                if (!mouseLocked) renderer.domElement.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                mouseLocked = document.pointerLockElement === renderer.domElement;
            });

            document.addEventListener('mousemove', (e) => {
                if (!mouseLocked) return;
                mouseX += e.movementX;
                mouseY += e.movementY;
            });

            // --- Синхронизация с сервером ---
            let socket = null;
            const remotePlayers = {};
            const remoteMeshes = {};
            let myId = '';
            let lastSend = 0;
            const TICK_RATE = 20;

            function createRemotePlayerMesh(color = 0xff4488) {
                const group = new THREE.Group();
                const bMat = new THREE.MeshPhongMaterial({ color, flatShading: true });
                const b = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.4, 0.6), bMat);
                b.position.y = 0.7;
                b.castShadow = true;
                group.add(b);

                const hMat = new THREE.MeshPhongMaterial({ color: 0xffccaa, flatShading: true });
                const h = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), hMat);
                h.position.y = 1.5;
                h.castShadow = true;
                group.add(h);
                return group;
            }

            function addRemotePlayer(id, data) {
                if (remoteMeshes[id]) return;
                const mesh = createRemotePlayerMesh(data.color || 0xff4488);
                mesh.position.set(data.x || 0, data.y || 1.5, data.z || 0);
                scene.add(mesh);
                remoteMeshes[id] = mesh;
                remotePlayers[id] = data;
            }

            function updateRemotePlayer(id, data) {
                if (remoteMeshes[id]) {
                    remoteMeshes[id].position.set(data.x || 0, data.y || 1.5, data.z || 0);
                    if (data.rotation !== undefined) {
                        remoteMeshes[id].rotation.y = data.rotation;
                    }
                }
            }

            function removeRemotePlayer(id) {
                const mesh = remoteMeshes[id];
                if (mesh) {
                    scene.remove(mesh);
                    delete remoteMeshes[id];
                    delete remotePlayers[id];
                }
            }

            function updateHUD() {
                const el = document.getElementById('count-display');
                if (el) el.textContent = 1 + Object.keys(remotePlayers).length;
            }

            function addChatMessage(name, text, color = '#00f3ff') {
                const log = document.getElementById('chat-log');
                if (!log) return;
                const div = document.createElement('div');
                div.className = 'msg';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.style.color = color;
                nameSpan.textContent = name + ': ';
                const textSpan = document.createElement('span');
                textSpan.className = 'text';
                textSpan.textContent = text;
                div.appendChild(nameSpan);
                div.appendChild(textSpan);
                log.appendChild(div);
                log.scrollTop = log.scrollHeight;
            }

            // --- WebSocket ---
            function initSocket() {
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const host = window.location.host;
                socket = new WebSocket(`${protocol}//${host}`);

                socket.onopen = () => {
                    console.log('🟢 Подключено к серверу');
                    document.getElementById('loading').textContent = '✅ Подключено!';
                    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 1000);
                };

                socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        switch (data.type) {
                            case 'init':
                                myId = data.myId;
                                for (const id in data.players) {
                                    if (id !== myId) addRemotePlayer(id, data.players[id]);
                                }
                                updateHUD();
                                break;
                            case 'playerJoin':
                                addRemotePlayer(data.id, data);
                                addChatMessage('Сервер', `Игрок ${data.id.slice(0,4)} зашёл`, '#ffaa00');
                                updateHUD();
                                break;
                            case 'playerMove':
                                updateRemotePlayer(data.id, data);
                                break;
                            case 'playerLeave':
                                removeRemotePlayer(data.id);
                                addChatMessage('Сервер', `Игрок ${data.id.slice(0,4)} вышел`, '#ff4444');
                                updateHUD();
                                break;
                            case 'chat':
                                addChatMessage(data.name || `Игрок [${data.id.slice(0,4)}]`, data.text, '#00f3ff');
                                break;
                        }
                    } catch (e) {
                        console.error('Ошибка парсинга:', e);
                    }
                };

                socket.onclose = () => {
                    console.log('🔴 Отключено от сервера');
                    document.getElementById('loading').textContent = '❌ Потеря соединения';
                    setTimeout(() => { initSocket(); }, 3000);
                };

                socket.onerror = (error) => {
                    console.error('❌ Ошибка WebSocket:', error);
                };
            }

            function sendToServer(data) {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    socket.send(JSON.stringify(data));
                }
            }

            function sendPosition(x, y, z, rotation) {
                const now = performance.now();
                if (now - lastSend < 1000 / TICK_RATE) return;
                lastSend = now;
                sendToServer({ type: 'move', x, y, z, rotation: rotation || 0 });
            }

            // --- Чат ---
            const chatToggle = document.getElementById('chat-toggle');
            const chatEl = document.getElementById('chat');
            const chatInput = document.getElementById('chat-input');
            const chatSend = document.getElementById('chat-send');
            let chatVisible = false;

            function toggleChat(show) {
                chatVisible = show !== undefined ? show : !chatVisible;
                chatEl.style.display = chatVisible ? 'flex' : 'none';
                if (chatVisible) {
                    if (document.pointerLockElement) document.exitPointerLock();
                    chatInput.focus();
                } else {
                    chatInput.blur();
                }
            }

            chatToggle.addEventListener('click', () => toggleChat());
            chatSend.addEventListener('click', () => {
                const text = chatInput.value.trim();
                if (!text) return;
                addChatMessage('Я', text, '#00ff88');
                sendToServer({ type: 'chat', text });
                chatInput.value = '';
                toggleChat(false);
            });
            chatInput.addEventListener('keydown', (e) => {
                e.stopPropagation();
                if (e.key === 'Enter') { chatSend.click(); }
                if (e.key === 'Escape') { toggleChat(false); }
            });

            // --- Главный цикл ---
            let delta = 0;
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                delta = Math.min(clock.getDelta(), 0.05);

                // --- Управление ---
                let moveX = 0,
                    moveZ = 0;
                if (keys['w'] || keys['keyw']) moveZ += 1;
                if (keys['s'] || keys['keys']) moveZ -= 1;
                if (keys['d'] || keys['keyd']) moveX += 1;
                if (keys['a'] || keys['keya']) moveX -= 1;

                // --- Камера ---
                eulerY -= mouseX * 0.0025;
                eulerX -= mouseY * 0.0025;
                eulerX = Math.max(-0.2, Math.min(1.2, eulerX));
                mouseX = 0;
                mouseY = 0;

                const horizDist = 6 * Math.cos(eulerX);
                const vertDist = 6 * Math.sin(eulerX);
                const targetY = playerPos.y + 1.5;
                let targetCamY = targetY + vertDist;
                if (targetCamY < 0.4) targetCamY = 0.4;

                const targetCamPos = new THREE.Vector3(
                    playerPos.x + horizDist * Math.sin(eulerY),
                    targetCamY,
                    playerPos.z + horizDist * Math.cos(eulerY)
                );
                camera.position.lerp(targetCamPos, 0.2);
                camera.lookAt(playerPos.x, targetY, playerPos.z);

                // --- Движение ---
                let moved = false;
                if (Math.abs(moveX) > 0.05 || Math.abs(moveZ) > 0.05) {
                    const len = Math.hypot(moveX, moveZ);
                    const normX = moveX / len;
                    const normZ = moveZ / len;
                    const sin = Math.sin(eulerY);
                    const cos = Math.cos(eulerY);

                    let dx = (-normZ * sin + normX * cos) * 11 * delta;
                    let dz = (-normZ * cos - normX * sin) * 11 * delta;

                    playerPos.x += dx;
                    playerPos.z += dz;
                    moved = true;
                    playerRotation = Math.atan2(dx, dz);
                    playerGroup.rotation.y = playerRotation;
                }

                // --- Гравитация и прыжки ---
                let floorY = 0;
                if (mainShip) {
                    rayOrigin.set(playerPos.x, playerPos.y + 3, playerPos.z);
                    downRaycaster.set(rayOrigin, downVector);
                    const hits = downRaycaster.intersectObject(mainShip, true);
                    if (hits.length > 0) {
                        const hit = hits[0];
                        if (hit.point.y >= -1 && (playerPos.y + 3 - hit.point.y) <= 20) {
                            floorY = hit.point.y;
                        }
                    }
                }

                const jumpForce = 7;
                const gravity = -20;

                if ((keys[' '] || keys['Space']) && isGrounded) {
                    velocityY = jumpForce;
                    isGrounded = false;
                }

                if (playerPos.y > floorY + 0.2 && isGrounded) {
                    isGrounded = false;
                }

                if (!isGrounded) {
                    velocityY += gravity * delta;
                    playerPos.y += velocityY * delta;
                    if (playerPos.y <= floorY) {
                        playerPos.y = floorY;
                        velocityY = 0;
                        isGrounded = true;
                    }
                } else {
                    playerPos.y = floorY;
                }

                playerGroup.position.set(playerPos.x, playerPos.y, playerPos.z);

                // --- Отправка позиции ---
                if (moved || !isGrounded) {
                    sendPosition(playerPos.x, playerPos.y, playerPos.z, playerRotation);
                }

                renderer.render(scene, camera);
            }

            // --- Ресайз ---
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // --- Запуск ---
            initSocket();

            // Спавним игрока на палубе
            playerPos.x = 0;
            playerPos.y = 1.5;
            playerPos.z = 5;
            playerGroup.position.set(playerPos.x, playerPos.y, playerPos.z);

            // Показываем кнопку чата на мобилках
            if ('ontouchstart' in window) {
                document.getElementById('chat-toggle').style.display = 'block';
            }

            animate();

            // --- Мобильные зоны ---
            if ('ontouchstart' in window) {
                const moveZone = document.createElement('div');
                moveZone.style.cssText =
                    'position:fixed;top:0;left:0;width:50%;height:100%;z-index:40;touch-action:none;';
                document.body.appendChild(moveZone);

                const lookZone = document.createElement('div');
                lookZone.style.cssText =
                    'position:fixed;top:0;right:0;width:50%;height:100%;z-index:40;touch-action:none;';
                document.body.appendChild(lookZone);

                const jumpBtn = document.getElementById('jump-btn');
                let moveTouchId = null,
                    lookTouchId = null;
                let lastMove = { x: 0, y: 0 };
                let lastLook = { x: 0, y: 0 };

                moveZone.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const t = e.changedTouches[0];
                    moveTouchId = t.identifier;
                    lastMove = { x: t.clientX, y: t.clientY };
                });

                moveZone.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for (const t of e.changedTouches) {
                        if (t.identifier === moveTouchId) {
                            const dx = t.clientX - lastMove.x;
                            const dy = t.clientY - lastMove.y;
                            keys['touchX'] = dx * 0.02;
                            keys['touchZ'] = -dy * 0.02;
                            lastMove = { x: t.clientX, y: t.clientY };
                        }
                    }
                });

                moveZone.addEventListener('touchend', (e) => {
                    for (const t of e.changedTouches) {
                        if (t.identifier === moveTouchId) {
                            moveTouchId = null;
                            keys['touchX'] = 0;
                            keys['touchZ'] = 0;
                        }
                    }
                });

                lookZone.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const t = e.changedTouches[0];
                    lookTouchId = t.identifier;
                    lastLook = { x: t.clientX, y: t.clientY };
                });

                lookZone.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for (const t of e.changedTouches) {
                        if (t.identifier === lookTouchId) {
                            mouseX += t.clientX - lastLook.x;
                            mouseY += t.clientY - lastLook.y;
                            lastLook = { x: t.clientX, y: t.clientY };
                        }
                    }
                });

                lookZone.addEventListener('touchend', (e) => {
                    for (const t of e.changedTouches) {
                        if (t.identifier === lookTouchId) {
                            lookTouchId = null;
                        }
                    }
                });

                jumpBtn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    keys['Space'] = true;
                });
                jumpBtn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    keys['Space'] = false;
                });
            }

            // Перехватываем touch-ввод для движения
            const origGetInput = Object.getOwnPropertyDescriptor(window, 'keys');
            Object.defineProperty(window, 'keys', {
                get: function() {
                    const k = this._keys || {};
                    // Добавляем touch-движение к WASD
                    if (k.touchX || k.touchZ) {
                        // Переопределяем moveX/moveZ через прокси
                    }
                    return k;
                },
                set: function(v) { this._keys = v; }
            });

            // Хак для движения с тача
            setInterval(() => {
                if (keys.touchX || keys.touchZ) {
                    // В движении используем touchX и touchZ
                }
            }, 16);

            console.log('🚢 Angelos City запущен!');
        })();
    </script>
</body>
</html>
