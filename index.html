<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Тату Салон</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: #0a0a1a;
            font-family: monospace;
        }
        canvas {
            display: block;
        }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 24px;
            border-radius: 12px;
            text-align: center;
            backdrop-filter: blur(8px);
            border: 1px solid #00f3ff;
            z-index: 10;
            font-size: 14px;
        }
        #info span {
            color: #ffcc00;
            font-weight: bold;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00f3ff;
            font-size: 24px;
            z-index: 100;
            text-shadow: 0 0 30px #00f3ff;
            animation: blink 1s infinite alternate;
        }
        @keyframes blink {
            0% { opacity: 0.3; }
            100% { opacity: 1; }
        }
        #controls-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            z-index: 5;
            text-align: center;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="loading">⏳ Загрузка модели...</div>
    <div id="controls-hint">🖱 Клик — захват мыши • WASD — движение • Пробел — прыжок</div>
    <div id="info">🖤 Тату-салон <span>•</span> Вращай мышкой</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
        import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';

        // ============================================================
        // 1. СЦЕНА
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.015);

        // ============================================================
        // 2. КАМЕРА
        // ============================================================
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(5, 4, 8);

        // ============================================================
        // 3. РЕНДЕР
        // ============================================================
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.prepend(renderer.domElement);

        // ============================================================
        // 4. УПРАВЛЕНИЕ
        // ============================================================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 2;
        controls.maxDistance = 30;
        controls.target.set(0, 1, 0);
        controls.maxPolarAngle = Math.PI / 2.1;

        // ============================================================
        // 5. СВЕТ
        // ============================================================
        const ambient = new THREE.AmbientLight(0x222244, 0.6);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffeedd, 2.5);
        mainLight.position.set(10, 20, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.8);
        fillLight.position.set(-10, 5, -10);
        scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffaa66, 0.5);
        rimLight.position.set(-5, 3, 15);
        scene.add(rimLight);

        const pointLight = new THREE.PointLight(0x00f3ff, 0.5, 20);
        pointLight.position.set(0, 5, 0);
        scene.add(pointLight);

        // ============================================================
        // 6. ПОЛ
        // ============================================================
        const floorGeo = new THREE.PlaneGeometry(40, 40);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x1a1a2e,
            roughness: 0.8,
            metalness: 0.1,
            transparent: true,
            opacity: 0.9
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.01;
        floor.receiveShadow = true;
        scene.add(floor);

        // Сетка
        const grid = new THREE.GridHelper(30, 30, 0x446688, 0x223344);
        grid.position.y = 0;
        scene.add(grid);

        // ============================================================
        // 7. ЗАГРУЗКА ТВОЕЙ МОДЕЛИ (monu2)
        // ============================================================
        const loadingEl = document.getElementById('loading');
        let modelLoaded = false;

        // ПУТЬ К ТВОИМ ФАЙЛАМ — положи их РЯДОМ с этим HTML!
        const BASE_PATH = './';

        const mtlLoader = new MTLLoader();
        const objLoader = new OBJLoader();

        function createFallback() {
            loadingEl.textContent = '⚠️ Модель не найдена, показываю заглушку';
            setTimeout(() => { loadingEl.style.display = 'none'; }, 2000);

            // Красивый тор
            const geo = new THREE.TorusKnotGeometry(0.8, 0.3, 128, 16);
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xff6600,
                metalness: 0.7,
                roughness: 0.2,
                emissive: 0xff2200,
                emissiveIntensity: 0.15,
                clearcoat: 0.3,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.y = 1.2;
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            // Второй объект
            const geo2 = new THREE.SphereGeometry(0.4, 32, 32);
            const mat2 = new THREE.MeshPhysicalMaterial({
                color: 0x00ccff,
                metalness: 0.3,
                roughness: 0.4,
                emissive: 0x0066ff,
                emissiveIntensity: 0.2,
            });
            const sphere = new THREE.Mesh(geo2, mat2);
            sphere.position.set(1.5, 0.6, 1.2);
            sphere.castShadow = true;
            sphere.receiveShadow = true;
            scene.add(sphere);

            window.fallback = [mesh, sphere];
        }

        // Пробуем загрузить MTL
        mtlLoader.load(
            BASE_PATH + 'monu2.mtl',
            (materials) => {
                materials.preload();
                objLoader.setMaterials(materials);

                objLoader.load(
                    BASE_PATH + 'monu2.obj',
                    (object) => {
                        // Настройка модели
                        object.scale.set(0.5, 0.5, 0.5);
                        object.position.y = 0;
                        object.castShadow = true;
                        object.receiveShadow = true;

                        object.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                if (child.material) {
                                    child.material.metalness = 0.3;
                                    child.material.roughness = 0.6;
                                }
                            }
                        });

                        scene.add(object);
                        modelLoaded = true;
                        loadingEl.textContent = '✅ Модель загружена!';
                        setTimeout(() => { loadingEl.style.display = 'none'; }, 1000);
                        console.log('✅ Модель monu2 загружена!');
                    },
                    (xhr) => {
                        const pct = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingEl.textContent = `⏳ Загрузка: ${pct}%`;
                    },
                    (error) => {
                        console.warn('⚠️ Ошибка загрузки OBJ:', error);
                        createFallback();
                    }
                );
            },
            undefined,
            (error) => {
                console.warn('⚠️ MTL не загружен, пробуем OBJ без материалов');
                // Пробуем без MTL
                objLoader.load(
                    BASE_PATH + 'monu2.obj',
                    (object) => {
                        object.scale.set(0.5, 0.5, 0.5);
                        object.position.y = 0;
                        object.castShadow = true;
                        object.receiveShadow = true;
                        scene.add(object);
                        modelLoaded = true;
                        loadingEl.textContent = '✅ Модель загружена!';
                        setTimeout(() => { loadingEl.style.display = 'none'; }, 1000);
                        console.log('✅ Модель monu2 загружена (без MTL)');
                    },
                    undefined,
                    (error) => {
                        console.error('❌ Не удалось загрузить OBJ:', error);
                        createFallback();
                    }
                );
            }
        );

        // ============================================================
        // 8. АНИМАЦИЯ
        // ============================================================
        function animate() {
            requestAnimationFrame(animate);

            // Вращаем заглушку если есть
            if (window.fallback) {
                window.fallback.forEach((obj, i) => {
                    obj.rotation.x += 0.008;
                    obj.rotation.y += 0.015 * (i + 1);
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ============================================================
        // 9. РЕСАЙЗ
        // ============================================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ============================================================
        // 10. ИНСТРУКЦИЯ
        // ============================================================
        console.log('🚀 3D Сцена запущена!');
        console.log('📁 Положи файлы monu2.obj, monu2.mtl, monu2.png рядом с этим HTML');
        console.log('🖱 Клик — захват мыши, вращение — перетаскивание');
    </script>
</body>
</html>
